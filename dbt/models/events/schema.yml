version: 2
models:
  - name: stg_events
    description: "One row per supplied event version; failed casts must fail tests before facts build."
    data_tests:
      - no_conflicting_versions:
          arguments:
            key_column: event_id
            version_column: updated_at
            payload_columns: [entity_id, event_type, event_at, metric_value, is_deleted]
    columns:
      - name: event_id
        data_tests: [not_blank]
      - name: entity_id
        data_tests: [not_blank]
      - name: event_at
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
      - name: is_deleted
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('event_type_lookup')", field: event_type}
  - name: stg_entities
    description: "Entity versions before latest-record selection."
    data_tests:
      - no_conflicting_versions:
          arguments:
            key_column: entity_id
            version_column: updated_at
            payload_columns: [entity_name, entity_type, status]
    columns:
      - name: entity_id
        data_tests: [not_blank]
      - name: entity_name
        data_tests: [not_blank]
      - name: entity_type
        data_tests: [not_blank]
      - name: status
        data_tests: [not_blank]
      - name: updated_at
        data_tests: [not_null]
  - name: int_latest_events
    description: "One latest version per event ID, including deletion tombstones. Ephemeral CTE."
  - name: dim_entities
    description: "One current row per entity; snapshots separately retain observed attribute history."
    columns:
      - name: entity_key
        data_tests: [unique, not_null]
      - name: entity_id
        data_tests: [unique, not_null]
  - name: fct_events
    description: "Latest event versions merged by event_id, including tombstones. Grain: one event."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: entity_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_entities')", field: entity_key}
      - name: updated_at
        data_tests: [not_null]
      - name: is_deleted
        data_tests: [not_null]
  - name: mart_entity_daily
    description: "Current entity attributes and non-deleted events by entity/day/type; no mixing of measurement units."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [entity_id, event_date, event_type]
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: metric_unit
        data_tests: [not_null]
      - name: event_count
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
