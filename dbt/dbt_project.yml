name: dbt_project
version: '2.0.0'
config-version: 2
profile: dbt_project
require-dbt-version: ['>=1.12.0', '<2.0.0']
model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]
clean-targets: [target, dbt_packages]
vars:
  # starter preserves existing commands; demo uses seeds; events reads RAW inputs.
  # Keep the inline starter fallbacks below in sync with this default.
  workload: starter
  event_lookback_days: 3
models:
  dbt_project:
    +persist_docs: {relation: true, columns: true}
    example:
      +enabled: "{{ var('workload', 'starter') == 'starter' }}"
      +tags: [starter]
      +materialized: view
    events:
      +enabled: "{{ var('workload', 'starter') in ['demo', 'events'] }}"
      +tags: [events]
      +schema: "{{ target.schema ~ '_' ~ var('workload', 'starter') }}"
      staging:
        +materialized: view
      intermediate:
        +materialized: ephemeral
      dimensions:
        +materialized: table
      marts:
        +materialized: table
seeds:
  dbt_project:
    +schema: "{{ target.schema ~ '_' ~ var('workload', 'starter') }}"
    +quote_columns: false
    +tags: [events]
    demo:
      +enabled: "{{ var('workload', 'starter') == 'demo' }}"
      +column_types:
        event_id: varchar
        entity_id: varchar
        event_at: varchar
        updated_at: varchar
    reference:
      +enabled: "{{ var('workload', 'starter') in ['demo', 'events'] }}"
snapshots:
  dbt_project:
    +enabled: "{{ var('workload', 'starter') in ['demo', 'events'] }}"
    +schema: "{{ target.schema ~ '_' ~ var('workload', 'starter') }}"
    +tags: [events, history]
data_tests:
  dbt_project:
    events:
      +enabled: "{{ var('workload', 'starter') in ['demo', 'events'] }}"
      +tags: [events]
