version: 2
snapshots:
  - name: snap_entities
    relation: ref('dim_entities')
    description: "SCD2 entity attributes observed at snapshot runs, not event-time CDC."
    config:
      unique_key: entity_id
      strategy: check
      check_cols: [entity_name, entity_type, status]
      hard_deletes: ignore
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: dbt_scd_id
        data_tests: [unique, not_null]
