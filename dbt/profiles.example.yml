# Copy to profiles.yml and fill in your Snowflake connection settings.
dbt_project:
  target: snowflake
  outputs:
    snowflake:
      type: snowflake
      account: YOUR_ACCOUNT_IDENTIFIER
      user: YOUR_USERNAME
      role: INTERVIEW_ROLE
      warehouse: COMPUTE_WH
      database: INTERVIEW_DB
      schema: ANALYTICS
      authenticator: username_password_mfa
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      threads: 4
      client_session_keep_alive: false
      # For unattended Airflow, use snowflake_jwt and remove the password field
      # and set a key registered for this user:
      # private_key_path: /absolute/path/to/snowflake_key.p8
      # private_key_passphrase: YOUR_KEY_PASSPHRASE  # only if encrypted
